name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneKeyboard.apk
      - uses: actions/upload-artifact@v5
        with:
          name: PhoneKeyboard-apk
          path: PhoneKeyboard.apk
      - name: Publish as "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PhoneKeyboard.apk \
            --title "Phone Keyboard (latest build)" \
            --notes "Tap PhoneKeyboard.apk below to download, then open it to install." \
            --target "${{ github.sha }}"
