plugins {
    id 'com.android.application'
}

android {
    namespace 'com.melvin.phonekeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.melvin.phonekeyboard'
        minSdk 28        // Android 9+ (Bluetooth keyboard mode needs it)
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
